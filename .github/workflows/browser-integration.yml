name: Browser integration

on:
  pull_request:
  push:
    branches: [main, dev, ai]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-integration:
    # Playwright 1.59.1 supports Ubuntu 24.04; avoid OS changes from ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017
      PUPPETEER_SKIP_DOWNLOAD: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare diagnostic directory
        run: mkdir -p tmp/e2e-artifacts
      - name: Install Playwright Chromium and Linux libraries
        run: npx playwright install --with-deps chromium 2>&1 | tee tmp/e2e-artifacts/browser-install.log
      - name: Parser browser fixtures
        run: npm run parser:browser-test 2>&1 | tee tmp/e2e-artifacts/parser-browser.log
      - name: Browser integration
        run: npm run ui:e2e 2>&1 | tee tmp/e2e-artifacts/browser-integration.log
      - name: Failure screenshots and diagnostic logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-integration-failures
          path: tmp/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
