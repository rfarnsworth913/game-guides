name: Browser integration

on:
  pull_request:
  push:
    branches: [main, dev, ai]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install Chrome
        run: npx puppeteer browsers install chrome
      - name: Install Linux browser libraries
        shell: bash
        run: |
          deps_file="$(node --input-type=module -e 'import puppeteer from "puppeteer"; import { dirname, join } from "node:path"; console.log(join(dirname(await puppeteer.executablePath()), "deb.deps"));')"
          test -f "$deps_file"
          sudo apt-get update
          sudo apt-get satisfy -y --no-install-recommends "$(tr '\n' ',' < "$deps_file")"
      - name: Allow Chrome sandbox user namespaces
        shell: bash
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == "1" ]]; then
            chrome_path="$(node --input-type=module -e 'import puppeteer from "puppeteer"; console.log(await puppeteer.executablePath());')"
            sudo tee /etc/apparmor.d/puppeteer-chrome >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile puppeteer-chrome "$chrome_path" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser --replace /etc/apparmor.d/puppeteer-chrome
          fi
      - name: Verify Chrome can launch
        run: |
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer';
          const browser = await puppeteer.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.goto('about:blank');
            console.log('Chrome launch verified:', await browser.version());
          } finally {
            await browser.close();
          }
          JS
      - name: Browser integration
        run: npm run ui:e2e
      - name: Failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-failures
          path: tmp/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
